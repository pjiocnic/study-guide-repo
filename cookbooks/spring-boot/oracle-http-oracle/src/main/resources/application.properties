# --- Oracle JDBC ---
spring.datasource.url=jdbc:oracle:thin:@//HOST:PORT/SERVICE
spring.datasource.username=YOUR_USER
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JdbcTemplate tuning
spring.jdbc.template.fetch-size=200
spring.jdbc.template.max-rows=0

# App config
app.batch-size=100

# Use SKIP LOCKED (Oracle 12c+) for safe parallel workers
app.use-skip-locked=true

# API to call; {id} will be replaced with the value from column A
app.remote.url=https://api.example.com/resource/{id}

# JSONPath to extract the ID from the API response (put into column B)
app.remote.jsonPath=$.data.id

# Logging level (optional)
logging.level.cookbook.oracle.fillb=INFO
