apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observability-app
  template:
    metadata:
      labels:
        app: observability-app
    spec:
      containers:
      - name: app
        image: your-dockerhub/springboot-app:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "actuator"
        volumeMounts:
        - name: logs
          mountPath: /var/log/app
      volumes:
      - name: logs
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: observability-app
spec:
  selector:
    app: observability-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080